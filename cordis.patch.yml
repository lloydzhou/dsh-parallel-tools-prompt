# Installing/enabling this bundle is the explicit opt-in. Direct plugin use
# defaults to enabled:false. Guidance goes into the system prompt by default;
# add `contextReminder: true` for the CONTEXT-message channel (or
# `systemPromptSection: false` to use only that channel). No preset replacement or scheduler changes.
- insert:
    - id: parallel-tools-prompt
      name: dsh-parallel-tools-prompt
      config:
        enabled: true
        presetIds: [standard]
